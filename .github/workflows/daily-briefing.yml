#               to: [process.env.MAIL_TO],
#               subject: fs.readFileSync("out/subject.txt", "utf8"),
#               html: fs.readFileSync("out/briefing.html", "utf8"),
#               text: fs.readFileSync("out/briefing.txt", "utf8")
#             })
#           }).then(r => r.text()).then(t => { console.log(t); })
#         '
#
# 대안 2) 메일 대신 Slack / Discord 웹훅
#   웹훅 URL 하나만 Secrets 에 넣으면 되고 앱 비밀번호가 필요 없다.
#   out/briefing.txt 를 그대로 본문으로 보내면 된다.
#
# 대안 3) GitHub Issue 로 받기
#   메일 설정 없이 바로 쓸 수 있다. permissions 에 issues: write 를 추가하고
#   actions/github-script 로 매일 이슈를 생성한다. 알림은 GitHub 앱이 보내준다.
