name: 콘텐츠 번들 빌드

# ---------------------------------------------------------------------------
# content/**.md 또는 data/*.json 이 바뀌면
# content/manifest.json 과 content/lessons.bundle.js 를 다시 생성해 커밋한다.
#
# 덕분에 평소에는 .md 파일만 고치면 되고,
# `node tools/build-content.mjs` 를 로컬에서 실행하는 것을 잊어도 된다.
# (로컬에서 미리 돌려 커밋해도 무방하다. 그 경우 이 워크플로는 변경 없음으로 끝난다)
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      - 'content/tracks.json'
      - 'data/*.json'
      - 'tools/build-content.mjs'
  workflow_dispatch:

permissions:
  contents: write             # 생성물을 커밋해야 하므로 write 가 필요하다

concurrency:
  group: build-content
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 콘텐츠 빌드
        run: node tools/build-content.mjs

      - name: 변경사항 확인
        id: diff
        run: |
          if git diff --quiet -- content/manifest.json content/lessons.bundle.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "생성물에 변경이 없습니다."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat -- content/manifest.json content/lessons.bundle.js
          fi

      - name: 커밋
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifest.json content/lessons.bundle.js
          git commit -m "chore: 콘텐츠 번들 재생성 [skip ci]"
          git push
