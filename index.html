<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>QA-Lab — QA 엔지니어 자기개발 학습 플랫폼</title>
<meta name="description" content="AI 기반 테스트 설계, 자동화, Agentic Testing, 성능테스트를 단계별로 학습하는 개인 QA 학습 플랫폼">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/lab.css">

<!-- 코드 하이라이팅 테마: 테마 전환 시 js/markdown.js 가 disabled 를 토글한다 -->
<link rel="stylesheet" id="hljs-light" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">
<link rel="stylesheet" id="hljs-dark" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" disabled>
</head>
<body>

<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<header class="topbar">
  <button class="icon-btn nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">🧪</span>
    <span class="brand-text">QA-Lab</span>
  </a>

  <div class="topbar-progress" title="전체 진도율">
    <div class="mini-bar"><span id="topbarBarFill" style="width:0%"></span></div>
    <span class="mini-bar-label" id="topbarBarLabel">0%</span>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="themeToggle" aria-label="테마 전환" title="테마 전환 (라이트 / 다크 / 시스템)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="icon-btn" href="#/settings" aria-label="설정" title="설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="주 메뉴">
    <div class="sidebar-inner" id="sidebarInner">
      <!-- js/ui/nav.js 가 채운다 -->
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main" tabindex="-1">
    <div id="view" class="view">
      <div class="loading-block">
        <div class="spinner" aria-hidden="true"></div>
        <p>학습 콘텐츠를 불러오는 중…</p>
      </div>
    </div>
  </main>
</div>

<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

<!-- 외부 라이브러리: CDN only, 번들러 없음 -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>

<!-- 앱 코드: classic script (file:// 에서도 동작하도록 ES module 사용 안 함) -->

<script src="js/lab/script-reviewer.js"></script>

<script src="js/ai/providers.js"></script>
<script src="js/ai/prompts.js"></script>
<script src="js/ai/ai-panel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
